<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact page</title>
</head>
<body>
    <form action="">

        <label for="name">Name : </label><br>
        <input type="text" id="name" name="fname" placeholder="Jon"><br>

        <label for="lastname">Lastname : </label><br>
        <input type="text" id="lastname" name="lname" placeholder="Carry"><br>
    
        <label for="email">Email : </label><br>
        <input type="email" id="email" name="email" placeholder="sephfz@gmail.com"><br>

        <label for="message">message : </label><br>
        <textarea name="message" id="message" rows="5" cols="30" placeholder="your message..."></textarea>
        <br>

        <button type="submit">send message</button>
        <button type="reset">reset</button>
    
    </form>






</body>
</html>
