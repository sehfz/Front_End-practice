<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Card </title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>

        body{
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card{
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 350px;
            width: 100%;
        }
        .profile{
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #667eea;
            margin-bottom: 15px;

        }
        h1{
            color: #2d3436;
            font-size: 24px;
            margin: 10px 0 5px ;
        }
        .title{
            color: #667eea;
            font: size 16px;
            font-weight:bold;
            margin:0 0 15px;
        }
        .bio{
            color: #636e72;
            font: size 14px;
            line-height: 1.6;
            margin:0 0 25px;
        }









        .social-links {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            margin-top: 20px;

        }
        .social-links a{
            text-decoration: none;
            color: #2d3436;
            background-color:#f0f0f0;
            padding: 12px 20px;
            border-radius: 30px;
            width: 150px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 16px;
            font-weight: 500;
            transition: all 0.3s ease;
        }
        .social-links a:hover{
            color: white;
            transform: scale(1.05);
            
        }
        .social-links a.github:hover {
            background-color: #333;

        }
        .social-links a.linkedin:hover {
            background-color: #0077b5;
            
        }
        .social-links a.twitter:hover {
            background-color: #1da1f2;

            
        }










    </style>
</head>
<body>
    
    <div class="card">
        <img src="https://i.pravatar.cc/150?img=11" alt="profile photo" class="profile">
        <h1>SEP HFZ</h1>
        <p class="title">Front-End Learner</p>
        <p class="bio">Passionate about coding, design, and building things for the web. </p>
        
        <div class="social-links">
            <a href="https://github.com/sehfz"  target="_blank" class="github">
                <i class="fab fa-github"></i>GitHub
            </a>
            <a href="#" class="linkedin">
                <i class="fab fa-linkedin"></i>LinkedIn
            </a>
            <a href="#" target="_blank" class="twitter">
                <i class="fab fa-twitter"></i> Twitter
            </a>
        </div>
    </div>
    
    
    
    
    
    


    






</body>
</html>
