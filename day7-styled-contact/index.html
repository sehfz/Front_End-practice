<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>styled contact</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            width: 400px;
            max-width: 95%;
        }
        h1 {
            color: #2d3436;
            text-align: center;
           margin-bottom: 5px;
        }
        .subtitle {
            color: #636e72;
            text-align: center;
            margin-top: 0;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display:block;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2d3436;
        }
        input, textarea {
            width: 100%;
            padding: 10px;
            border: 2px solid #dfe6e9;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
        }
        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor:pointer ;
            transition: transform 0.3s ease,box-shadow 0.3s ease ;
        }   
        button:hover{
            transform: scale(1.02);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }






    </style>

</head>
<body>

<div class="container">
    <h1>Contact Me</h1>
    <p class="subtitle">I'd love to hear from you!</p>

    
    <form>
        <div class="form-group">
            <label for="name">Name</label><br>
            <input type="text" id="name" name="fname" placeholder="Your name">
        </div>
        
        <div>
            <label for="email">Email</label><br>
            <input type="email" id="email" name="email" placeholder="Your Email">
        </div>

        <div class="form-group">
            <label for="message">Message</label><br>
            <textarea name="message" id="message" rows="5" cols="30" placeholder="your message..."></textarea>
        </div>

        <button type="submit">send message</button>
    
    </form>

</div>
</body>
</html>
